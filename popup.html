<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device Tabs Picker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="app-header">
      <div class="orbs" aria-hidden="true">
        <span class="orb orb-red"></span><span class="orb orb-yellow"></span><span class="orb orb-green"></span>
      </div>
      <h1 id="app-title">Device <em>tabs</em></h1>
      <button id="settings-button" class="icon-button" type="button" title="Shared Links settings" aria-label="Open Shared Links settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button id="refresh-button" class="icon-button" type="button" title="Refresh" aria-label="Refresh synced tabs">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8.1 8.1 0 0 0-14.9-4L3 9m0 0V4m0 5h5M4 13a8.1 8.1 0 0 0 14.9 4L21 15m0 0v5m0-5h-5"/>
        </svg>
      </button>
    </header>

    <div class="view-switcher" role="tablist" aria-label="View">
      <button id="tabs-view-button" class="view-tab is-active" type="button" role="tab" aria-selected="true">Tabs</button>
      <button id="opened-view-button" class="view-tab" type="button" role="tab" aria-selected="false">Opened</button>
    </div>

    <div id="tabs-view">
      <p id="summary" class="summary" aria-live="polite">Loading synced tabs…</p>

      <section class="toolbar" aria-label="Tab controls">
        <label class="search">
          <span class="visually-hidden">Filter tabs</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
          <input id="search-input" type="search" autocomplete="off" placeholder="Filter by title, URL, or device">
        </label>
        <button id="select-visible-button" class="text-button" type="button">Select visible</button>
      </section>

      <div id="status" class="status" hidden role="status"></div>
      <div id="device-list" class="device-list" aria-live="polite"></div>
    </div>

    <div id="opened-view" hidden>
      <div id="opened-list" class="device-list opened-list" aria-live="polite"></div>
    </div>

    <footer id="footer" class="footer">
      <span id="selection-count" class="selection-count">0 selected</span>
      <div class="footer-actions">
        <button id="open-all-button" class="secondary-button" type="button" disabled>Open all</button>
        <button id="open-button" class="primary-button" type="button" disabled>Open selected</button>
      </div>
    </footer>
  </main>

  <template id="device-template">
    <section class="device">
      <div class="device-header">
        <label class="device-select">
          <input class="device-checkbox" type="checkbox">
          <span class="custom-checkbox" aria-hidden="true"></span>
          <span class="device-name"></span>
        </label>
        <span class="device-count"></span>
      </div>
      <div class="tabs"></div>
    </section>
  </template>

  <template id="tab-template">
    <label class="tab-row">
      <input class="tab-checkbox" type="checkbox">
      <span class="custom-checkbox" aria-hidden="true"></span>
      <span class="tab-copy">
        <span class="tab-title"></span>
        <span class="tab-url"></span>
      </span>
      <button class="tab-delete-button" type="button" title="Discard" aria-label="Discard shared link" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M9 7V4h6v3m-7 0 1 13h6l1-13"/>
        </svg>
      </button>
    </label>
  </template>

  <script src="storage-keys.js"></script>
  <script src="popup.js"></script>
</body>
</html>
